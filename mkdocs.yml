site_name: A Little Python
site_description: A short, conversational introduction to Python for creative and procedural work in games.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Chapters:
      - "1. Containers and Elements": chapter-1.md
      - "2. Access, Membership, and Change": chapter-2.md
      - "3. Comprehensions": chapter-3.md
      - "4. Repetition and Process": chapter-4.md
      - "5. Conditions, Truthiness, and Choice": chapter-5.md
      - "6. Functions and Abstraction": chapter-6.md
      - "7. Moving Several Values Together": chapter-7.md
      - "8. Randomness and Generation": chapter-8.md
      - "9. Two-Dimensional Worlds in One Dimension": chapter-9.md
      - "10. Sets, Membership, and Regions": chapter-10.md
      - "11. Persistence": chapter-11.md
      - "12. Composition": chapter-12.md
      - "13. Procedural Generation": chapter-13.md
      - "14. PIL": chapter-14.md
      - "15. Procedural PIL": chapter-15.md
      - "16. Sound as a List of Samples": chapter-16.md
      - "17. Building Sound Effects": chapter-17.md
  - Editorial Summary: editorial-summary.md
